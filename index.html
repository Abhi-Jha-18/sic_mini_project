<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="shortcut icon" href="/favicon.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="theme-color" content="#08090C">
  <meta name="description" content="PhoneFit — answer two quick questions and get 3–4 tailored mobile phone recommendations for your purpose and budget.">
  <link rel="manifest" href="/manifest.json">

  <!-- Google Fonts: Gabarito (display & body) · JetBrains Mono (figures) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome 6 Free -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans:    ['Gabarito', 'system-ui', '-apple-system', 'sans-serif'],
            display: ['Gabarito', 'system-ui', 'sans-serif'],
            mono:    ['"JetBrains Mono"', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace'],
          },
          colors: {
            /* Brand core — denim blue, brightened for the black theme */
            accent: { DEFAULT: '#7FA0C9', dark: '#6288B4', light: '#A8C4E2' },
            /* Mosaic tones (mirror the five purpose tints in the dataset) */
            plum:  '#9C8BD8',   // gaming violet
            terra: '#D0967B',   // camera terracotta
            sage:  '#8FC1A4',   // battery sage
            straw: '#C9B98F',   // everyday taupe
            ink:   '#F2F0EC',   // dark theme: near-white for headings & prices
            panel: '#141419',   // raised card surface
            line:  '#2A2A33',   // hairline borders on black
          },
          boxShadow: {
            glow:   '0 10px 28px -8px rgba(127, 160, 201, 0.40)',
            lift:   '0 16px 40px -14px rgba(0, 0, 0, 0.75)',
            tile:   '0 8px 22px -10px rgba(0, 0, 0, 0.60)',
          },
          borderRadius: { '4xl': '2rem' },
          keyframes: {
            fadeUp:   { '0%': { opacity: '0', transform: 'translateY(16px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
            fadeIn:   { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
            modalIn:  {
              '0%':   { opacity: '0', transform: 'translateY(12px) scale(0.97)' },
              '100%': { opacity: '1', transform: 'translateY(0) scale(1)' },
            },
            blobDrift: {
              '0%, 100%': { transform: 'translate(0, 0) scale(1)' },
              '50%':      { transform: 'translate(24px, -18px) scale(1.06)' },
            },
          },
          animation: {
            'fade-up': 'fadeUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) both',
            'fade-in': 'fadeIn 0.25s ease-out both',
            'modal-in': 'modalIn 0.32s cubic-bezier(0.22, 1, 0.36, 1) both',
            'blob':    'blobDrift 14s ease-in-out infinite',
          },
        }
      }
    }
  </script>

  <style>
    /* ── Base · true-black canvas with faint colour blooms ────────────────── */
    *, *::before, *::after { box-sizing: border-box; }
    html {
      scroll-behavior: smooth;
      background:
        radial-gradient(1100px 560px at 86% -8%,   rgba(127, 160, 201, 0.10), transparent 60%),
        radial-gradient(950px 520px at -8% 24%,    rgba(156, 139, 216, 0.08), transparent 62%),
        radial-gradient(1050px 620px at 55% 112%,  rgba(208, 150, 123, 0.07), transparent 62%),
        #08090C;
      background-attachment: fixed;
    }
    body {
      font-family: 'Gabarito', system-ui, -apple-system, sans-serif;
      color: #ECEAE6;
      margin: 0;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* Display type: geometric, tightly tracked */
    .font-display { letter-spacing: -0.02em; }

    /* Figures & prices: tabular mono */
    .font-mono { font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }

    /* Gradient headline text — denim → plum → terra, tuned for black */
    .text-gradient {
      background: linear-gradient(98deg, #7FA0C9 0%, #9C8BD8 46%, #D0967B 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    /* Signature button — bright denim→plum gradient with a neon-tinted glow */
    .btn-primary {
      background: linear-gradient(120deg, #6288B4 0%, #7B78BE 55%, #9C8BD8 100%);
      color: #fff;
      box-shadow: 0 10px 30px -8px rgba(127, 160, 201, 0.45);
      transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
    }
    .btn-primary:hover:not(:disabled) {
      transform: translateY(-1px);
      filter: brightness(1.1);
      box-shadow: 0 14px 36px -8px rgba(127, 160, 201, 0.6);
    }
    .btn-primary:active:not(:disabled) { transform: translateY(0); }

    /* Purpose cards adopt their --tint on hover (set inline from data) */
    .purpose-card { transition: transform .2s ease, box-shadow .25s ease, border-color .2s ease; }
    .purpose-card:hover {
      border-color: color-mix(in srgb, var(--tint) 55%, #2A2A33);
      box-shadow: 0 18px 38px -14px color-mix(in srgb, var(--tint) 40%, transparent),
                  0 2px 10px -2px rgba(0, 0, 0, 0.6);
    }
    @supports not (color: color-mix(in srgb, red, white)) {
      .purpose-card:hover { border-color: var(--tint); }
    }

    /* Keyboard focus, colour-coordinated */
    a:focus-visible, button:focus-visible, input:focus-visible {
      outline: 2px solid rgba(168, 196, 226, 0.65);
      outline-offset: 2px;
      border-radius: 6px;
    }

    /* Slim dark scrollbar */
    ::-webkit-scrollbar       { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #3A3A44; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #55555F; }

    /* Mosaic text selection */
    ::selection { background: rgba(156, 139, 216, 0.30); }

    /* Buttons inherit the typeface */
    button, input { font-family: inherit; }

    /* Reduce motion for accessibility */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>

  <title>PhoneFit — Find the phone that fits your life</title>
</head>
<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
  <script type="module" src="/src/index.jsx"></script>
</body>
</html>
