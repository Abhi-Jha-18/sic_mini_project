<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="shortcut icon" href="%PUBLIC_URL%/favicon.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="theme-color" content="#FAFAF9">
  <meta name="description" content="PhoneFit — answer two quick questions and get 3–4 tailored mobile phone recommendations for your purpose and budget.">
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json">

  <!-- Google Fonts: Inter (modern, clean typography) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome 6 Free -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
          },
          colors: {
            /* Single muted accent — calm slate blue on warm off-white */
            accent: { DEFAULT: '#4A6785', dark: '#3A5269', light: '#7C93AC' },
          },
          keyframes: {
            fadeUp:  { '0%': { opacity: '0', transform: 'translateY(16px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
            fadeIn:  { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
            modalIn: {
              '0%':   { opacity: '0', transform: 'translateY(12px) scale(0.97)' },
              '100%': { opacity: '1', transform: 'translateY(0) scale(1)' },
            },
          },
          animation: {
            'fade-up':   'fadeUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) both',
            'fade-in':   'fadeIn 0.25s ease-out both',
            'modal-in':  'modalIn 0.32s cubic-bezier(0.22, 1, 0.36, 1) both',
          },
        }
      }
    }
  </script>

  <style>
    /* ── Minimalist base ─────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #FAFAF9;              /* warm off-white */
      color: #1C1917;                    /* stone-900 */
      margin: 0;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* Soft, light scrollbar */
    ::-webkit-scrollbar       { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #D6D3D1; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #A8A29E; }

    /* Muted text selection */
    ::selection { background: rgba(74, 103, 133, 0.18); }

    /* Buttons inherit the typeface */
    button, input { font-family: inherit; }

    /* Reduce motion for accessibility */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>

  <title>PhoneFit — Find the phone that fits your life</title>
</head>
<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
</body>
</html>
